<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タスク管理</title>
<style>
  :root {
    --bg:#f5f6f8; --card:#fff; --text:#1f2933; --muted:#6b7785; --line:#e1e5ea;
    --stripe:rgba(0,0,0,.035); --hover:rgba(37,99,235,.10); --accent:#2563eb; --danger:#dc2626; --warn:#d97706; --ok:#16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --card:#1d222a; --text:#e6e9ee; --muted:#93a0af; --line:#2f3743; --accent:#5b8def; --stripe:rgba(255,255,255,.045); --hover:rgba(91,141,239,.16); }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 "Yu Gothic UI","Meiryo",system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; }
  #fileInfo { color:var(--muted); font-size:12px; }
  #saveState { font-size:12px; margin-left:auto; color:var(--muted); }
  main { padding:16px 20px; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; border:1px solid var(--line); background:var(--card); border-radius:6px; padding:5px 12px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--danger); }
  button:disabled { opacity:.5; cursor:default; }
  input, select, textarea { border:1px solid var(--line); background:var(--card); border-radius:5px; padding:4px 6px; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; }

  #welcome { max-width:520px; margin:60px auto; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:28px; text-align:center; }
  #welcome p { color:var(--muted); }
  #welcome .row { display:flex; gap:10px; justify-content:center; margin-top:16px; }
  [hidden] { display:none !important; }
  .banner { background:#fff7e6; border:1px solid #f5d28a; color:#7a4b00; padding:2px 8px; border-radius:6px; font-size:12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .banner button { padding:2px 8px; font-size:12px; }
  @media (prefers-color-scheme: dark) { .banner { background:#3a2e12; border-color:#6b5320; color:#f3d9a0; } }

  .filters { display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:12px; }
  .filters select, .filters input[type=search] { padding:5px 8px; }
  .filters .chk { display:inline-flex; align-items:center; gap:4px; font-size:13px; white-space:nowrap; }
  .filters .sep { width:1px; align-self:stretch; background:var(--line); margin:2px 2px; }
  .search { display:flex; }
  .search input { width:200px; border-top-right-radius:0; border-bottom-right-radius:0; }
  .search select { border-left:0; border-top-left-radius:0; border-bottom-left-radius:0; color:var(--muted); }
  button.ghost { border-color:transparent; background:transparent; color:var(--muted); }
  .more { position:relative; }
  .more summary { list-style:none; cursor:pointer; border:1px solid var(--line); border-radius:6px; padding:4px 10px; user-select:none; }
  .more summary::-webkit-details-marker { display:none; }
  .more[open] summary { border-color:var(--accent); }
  .more .menu { position:absolute; z-index:60; top:calc(100% + 4px); left:0; min-width:200px; background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 24px rgba(0,0,0,.3); padding:4px; display:flex; flex-direction:column; }
  .more .menu button { border:0; text-align:left; background:transparent; padding:7px 10px; }
  .more .menu button:hover { background:rgba(37,99,235,.15); }
  .count { margin-left:auto; color:var(--muted); font-size:12px; }

  .tablewrap { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:auto; }
  table { border-collapse:collapse; table-layout:fixed; }
  th { overflow:visible; }
  .rs { position:absolute; right:-3px; top:0; bottom:0; width:7px; cursor:col-resize; z-index:2; }
  th:last-child .rs { right:0; }
  input.effort { text-align:right; }
  th.dragging { opacity:.4; }
  th.drop-l { box-shadow:inset 3px 0 0 var(--accent); }
  th.drop-r { box-shadow:inset -3px 0 0 var(--accent); }
  .rs:hover, .rs.drag { background:var(--accent); opacity:.5; }
  td { overflow-wrap:anywhere; }
  td input[type=date], td input[type=number], td select { width:100%; min-width:0; max-width:100%; }
  input[type=number] { appearance:textfield; -moz-appearance:textfield; }
  a.linkicon { text-decoration:none; font-size:16px; }
  .linkedit { display:flex; flex-direction:column; gap:4px; }
  .lrow { display:flex; gap:4px; align-items:center; }
  .lrow input.l-title { width:36%; flex:none; }
  .lrow input.l-url { flex:1; min-width:0; width:auto; }
  .lrow .lrm, .linkedit .ladd { padding:2px 8px; font-size:12px; flex:none; }
  .linkedit .ladd { align-self:flex-start; }
  .moreRows { padding:12px; text-align:center; color:var(--muted); font-size:13px; border-top:1px solid var(--line); }
  .moreRows button { margin-left:6px; }
  .chip.hold { color:var(--muted); border-color:var(--muted); }
  .remain.hold { color:var(--muted); font-weight:400; }
  tr.hold td { color:var(--muted); }
  .adv { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:12px; display:flex; flex-direction:column; gap:8px; }
  .adv-head { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px; }
  .adv-head > span:last-child, .hint { color:var(--muted); font-size:12px; }
  #conds { display:flex; flex-direction:column; gap:6px; }
  .crow { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .crow input { min-width:160px; }
  .crow .lrm { padding:2px 8px; font-size:12px; }
  .linkbtn { padding:1px 6px; font-size:14px; white-space:nowrap; }
  .linkbtn span { font-size:11px; font-weight:700; margin-left:2px; color:var(--accent); }
  .linkmenu { position:fixed; z-index:100; background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 24px rgba(0,0,0,.3); padding:4px; max-width:min(420px, 92vw); }
  .linkmenu a { display:block; padding:6px 10px; border-radius:5px; color:var(--text); text-decoration:none; overflow-wrap:anywhere; }
  .linkmenu a small { display:block; color:var(--muted); font-size:11px; margin-left:22px; }
  .linkmenu a:hover { background:rgba(37,99,235,.15); color:var(--accent); }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { position:sticky; top:0; background:var(--card); font-size:12px; color:var(--muted); white-space:nowrap; user-select:none; }
  th.sortable { cursor:pointer; }
  th.sortable:hover { color:var(--accent); }
  tr:last-child td { border-bottom:none; }
  tr.done td { opacity:.55; }
  tr.editing td { background:rgba(37,99,235,.06); }
  td.name { font-weight:600; min-width:180px; }
  td input[type=text], td input[type=url] { width:100%; }
  td textarea { width:100%; min-width:0; min-height:30px; resize:vertical; }
  td select { max-width:100%; }
  td.act { white-space:nowrap; }
  td.act button { padding:3px 8px; font-size:12px; }
  td.remain { white-space:nowrap; font-weight:600; }
  .over { color:var(--danger); }
  .soon { color:var(--warn); }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600; }
  .p-高 { background:#fde2e2; color:#b91c1c; }
  .p-中 { background:#fdf0d0; color:#92600a; }
  .p-低 { background:#e0ecff; color:#1d4ed8; }
  td a { color:var(--accent); word-break:break-all; }
  /* 1行おきの背景色とホバー強調 (:where で詳細度を下げ、期限切れ等の色を優先) */
  tbody tr:where(:nth-child(even)) td { background:var(--stripe); }
  tbody tr:where(:hover) td { background:var(--hover); }
  tr.overdue td { background:rgba(220,38,38,.09); }
  tr.today td { background:rgba(217,119,6,.13); }
  .sub { font-size:11px; color:var(--muted); font-weight:400; }
  .summary { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; font-size:13px; color:var(--muted); }
  .chip { border-radius:14px; padding:3px 12px; font-weight:600; }
  .chip.over { color:var(--danger); border-color:var(--danger); }
  .chip.today { color:var(--warn); border-color:var(--warn); }
  .chip.soon { color:var(--accent); border-color:var(--accent); }
  .chip.active { color:#fff; background:currentColor; }
  .chip.active > span { color:#fff; }
  .hist { display:flex; gap:4px; }
  .hist button { padding:3px 9px; font-size:12px; }
  .empty { padding:30px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>📋 タスク管理</h1>
  <div id="reconnect" class="banner" hidden>
    <span id="reconnectMsg">前回のファイルへのアクセス許可が必要です。</span>
    <button class="primary" id="btnRepick">同じファイルを選び直す</button>
    <button id="btnReconnect">再接続</button>
    <button id="btnOther">別のファイルを選ぶ</button>
  </div>
  <span id="fileInfo"></span>
  <button id="btnChange" hidden>ファイル変更</button>
  <span class="hist" id="hist" hidden>
    <button id="btnUndo" title="元に戻す (Ctrl+Z)" disabled>↶ 元に戻す</button>
    <button id="btnRedo" title="やり直す (Ctrl+Y)" disabled>↷ やり直す</button>
  </span>
  <span id="saveState"></span>
</header>

<main>
  <div id="welcome" hidden>
    <h2>データファイルを選択してください</h2>
    <p>OneDrive などのフォルダに JSON ファイルとして保存されます。<br>
       一度選ぶと次回以降は自動で同じファイルを開きます。</p>
    <div class="row">
      <button class="primary" id="btnNew">新規ファイルを作成</button>
      <button id="btnOpen">既存ファイルを開く</button>
    </div>
    <p id="unsupported" hidden style="color:var(--danger)">このブラウザは File System Access API に未対応です。Chrome / Edge で開いてください。</p>
  </div>

  <div id="app" hidden>
    <div class="summary" id="summary"></div>
    <div class="filters">
      <div class="search">
        <input type="search" id="fText" placeholder="🔍 キーワード検索">
        <select id="fTextField" title="検索対象"></select>
      </div>
      <select id="fStatus"></select>
      <select id="fPriority"></select>
      <select id="fDueRel"></select>
      <label class="chk"><input type="checkbox" id="fHideDone" checked> 完了を隠す</label>
      <button id="btnAdv" title="AND / OR で複数の条件を組み合わせられます">詳細条件 ▾</button>
      <button id="btnClear" class="ghost">クリア</button>
      <span class="sep"></span>
      <select id="fPreset" title="保存した条件"></select>
      <details class="more" id="more">
        <summary title="条件の保存・列の初期化">⋯</summary>
        <div class="menu">
          <button id="btnPresetSave">現在の条件を保存…</button>
          <button id="btnPresetDel" class="danger">選択中の条件を削除</button>
          <button id="btnColReset" title="見出しのドラッグで列の移動、境界のドラッグで列幅を変更できます">列の並び・幅を初期化</button>
        </div>
      </details>
      <span class="count" id="count"></span>
      <button class="primary" id="btnAdd">＋ タスク追加</button>
    </div>
    <div class="adv" id="adv" hidden>
      <div class="adv-head">
        <span>次の条件を</span>
        <select id="advMode"><option value="and">すべて満たす (AND)</option><option value="or">いずれか満たす (OR)</option></select>
        <span>タスクを表示します(上の絞り込みとは AND で組み合わさります)</span>
      </div>
      <div id="conds"></div>
      <div><button id="btnAddCond">＋ 条件を追加</button></div>
    </div>
    <div class="tablewrap">
      <table id="tbl">
        <colgroup id="cols"></colgroup>
        <thead id="thead"></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>該当するタスクがありません</div>
      <div class="moreRows" id="moreRows" hidden></div>
    </div>
  </div>
</main>

<script>
(() => {
  'use strict';
  const STATUSES = ['未着手', '進行中', '保留', '完了'];
  const PRIORITIES = ['高', '中', '低'];
  const PRIO_ORDER = { '高': 0, '中': 1, '低': 2 };
  const STATUS_ORDER = { '未着手': 0, '進行中': 1, '保留': 2, '完了': 3 };

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---------- IndexedDB (ファイルハンドル保存) ----------
  const idb = {
    open() {
      return new Promise((res, rej) => {
        const r = indexedDB.open('task-manager', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    },
    async get(k) {
      const db = await this.open();
      return new Promise((res, rej) => {
        const q = db.transaction('kv').objectStore('kv').get(k);
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      });
    },
    async set(k, v) {
      const db = await this.open();
      return new Promise((res, rej) => {
        const t = db.transaction('kv', 'readwrite');
        t.objectStore('kv').put(v, k);
        t.oncomplete = () => res(); t.onerror = () => rej(t.error);
      });
    }
  };

  // ---------- 状態 ----------
  let handle = null;
  let tasks = [];
  let editingId = null;
  let newId = null; // 追加直後で未確定のレコード (取消時に破棄)
  let lastModified = 0;
  let saving = Promise.resolve();
  let sort = { k: 'due', dir: 1 };
  const defaultFilters = () => ({ text:'', textField:'all', status:'', priority:'', hideDone:true, dueRel:'', mode:'and', conds:[] });
  const filters = defaultFilters();
  let advOpen = false;         // 詳細条件パネルの開閉
  let presets = [];            // 保存した絞り込み条件 (ファイルに一緒に保存)
  let undoStack = [], redoStack = [];
  const DUE_RELS = [['overdue','期限切れ'], ['today','今日'], ['d3','明日〜3日後'], ['d7','7日以内(今日含む)'], ['none','期日なし']];

  // ---------- 日付 ----------
  const localISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
  const parseDate = s => { if (!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  const remainDays = t => {
    const due = parseDate(t.due);
    return due ? Math.round((due - today()) / 86400000) : null;
  };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // ---------- ファイル入出力 ----------
  const setState = (msg, cls) => { const e = $('saveState'); e.textContent = msg; e.style.color = cls === 'err' ? 'var(--danger)' : cls === 'ok' ? 'var(--ok)' : 'var(--muted)'; };

  async function retry(fn, n = 4) {
    for (let i = 0; ; i++) {
      try { return await fn(); }
      catch (e) { if (i >= n - 1) throw e; await new Promise(r => setTimeout(r, 300 * (i + 1))); }
    }
  }

  async function loadFile() {
    let f, text;
    await retry(async () => { f = await handle.getFile(); text = await f.text(); });
    lastModified = f.lastModified;
    if (!text.trim()) { tasks = []; presets = []; return; }
    const data = JSON.parse(text);
    tasks = Array.isArray(data) ? data : (data.tasks || []);
    // 旧形式 (link: 文字列) → links: 配列 へ移行
    // 文字列だけのリンクは { url, title(別名) } 形式へ
    tasks.forEach(t => {
      if (!Array.isArray(t.links)) t.links = t.link ? [t.link] : [];
      t.links = t.links.map(l => typeof l === 'string' ? { url: l, title: '' } : { url: l.url || '', title: l.title || '' });
      delete t.link;
    });
    presets = (!Array.isArray(data) && data.presets) || [];
  }

  // ---------- 元に戻す / やり直す ----------
  const snapshot = () => JSON.stringify(tasks.filter(x => x.id !== newId)); // 未確定の新規行は含めない
  function updateHistoryButtons() {
    $('btnUndo').disabled = !undoStack.length;
    $('btnRedo').disabled = !redoStack.length;
    $('btnUndo').title = undoStack.length ? `元に戻す: ${undoStack[undoStack.length-1].label} (Ctrl+Z)` : '元に戻す (Ctrl+Z)';
  }
  function pushUndo(label) {
    undoStack.push({ label, snap: snapshot() });
    if (undoStack.length > 100) undoStack.shift();
    redoStack = [];
    updateHistoryButtons();
  }
  function resetHistory() { undoStack = []; redoStack = []; updateHistoryButtons(); }
  function restore(from, to, verb) {
    const e = from.pop(); if (!e) return;
    to.push({ label: e.label, snap: snapshot() });
    tasks = JSON.parse(e.snap);
    editingId = newId = null;
    save(); render(); updateHistoryButtons();
    setState(`${verb}しました（${e.label}）`, 'ok');
  }
  const undo = () => restore(undoStack, redoStack, '元に戻');
  const redo = () => restore(redoStack, undoStack, 'やり直');

  // ステータス変更 (完了日の自動記録)
  function setStatus(t, v) {
    t.status = v;
    if (v === '完了') { if (!t.completed) t.completed = localISO(today()); }
    else delete t.completed;
  }

  function save() {
    setState('保存中…');
    saving = saving.then(async () => {
      try {
        // OneDrive の同期などでファイルが書込み中に変化すると InvalidStateError になるため、再試行する
        await retry(async () => {
          const w = await handle.createWritable();
          await w.write(JSON.stringify({ version: 1, tasks: tasks.filter(x => x.id !== newId), presets }, null, 2));
          await w.close();
        });
        try { lastModified = (await handle.getFile()).lastModified; } catch { /* 保存自体は成功 */ }
        setState('保存しました ' + new Date().toLocaleTimeString(), 'ok');
      } catch (e) {
        console.error(e);
        setState('保存失敗: ' + e.message, 'err');
      }
    });
    return saving;
  }

  async function ensurePermission(interactive) {
    const opts = { mode: 'readwrite' };
    if (await handle.queryPermission(opts) === 'granted') return true;
    if (interactive && await handle.requestPermission(opts) === 'granted') return true;
    return false;
  }

  async function useHandle(h, isNew) {
    handle = h;
    await idb.set('handle', h);
    editingId = newId = null; resetHistory();
    if (isNew) { tasks = []; presets = []; await save(); } else { await loadFile(); }
    showApp();
  }

  const pickerTypes = [{ description: 'タスクデータ (JSON)', accept: { 'application/json': ['.json'] } }];

  async function createFile() {
    try {
      const h = await showSaveFilePicker({ suggestedName: 'tasks.json', types: pickerTypes });
      await useHandle(h, true);
    } catch (e) { if (e.name !== 'AbortError') alert('作成に失敗しました: ' + e.message); }
  }
  async function openFile() {
    try {
      const [h] = await showOpenFilePicker({ types: pickerTypes });
      await useHandle(h, false);
    } catch (e) { if (e.name !== 'AbortError') alert('読み込みに失敗しました: ' + e.message); }
  }

  // ---------- 画面切替 ----------
  function showWelcome() {
    $('welcome').hidden = false; $('app').hidden = true; $('reconnect').hidden = true; $('btnChange').hidden = true; $('hist').hidden = true;
    $('fileInfo').textContent = '';
  }
  function showReconnect(msg) {
    $('welcome').hidden = true; $('app').hidden = true; $('reconnect').hidden = false; $('btnChange').hidden = true; $('hist').hidden = true;
    $('reconnectMsg').textContent = msg || '前回のファイル「' + handle.name + '」へのアクセス許可が必要です。';
    $('fileInfo').textContent = '';
  }
  function showApp() {
    $('welcome').hidden = true; $('reconnect').hidden = true; $('app').hidden = false; $('btnChange').hidden = false; $('hist').hidden = false;
    $('fileInfo').textContent = '📄 ' + handle.name;
    setState('');
    renderPresets();
    render();
  }

  // ---------- フィルタ・ソート ----------
  function matchDueRel(t, rel) {
    if (rel === 'none') return !t.due;
    if (t.status === '完了' || t.status === '保留') return false; // 保留中は期日超過などのアラート対象外
    const r = remainDays(t); if (r === null) return false;
    switch (rel) {
      case 'overdue': return r < 0;
      case 'today': return r === 0;
      case 'd3': return r >= 1 && r <= 3;
      case 'd7': return r >= 0 && r <= 7;
    }
    return true;
  }
  // ---------- 詳細条件 (項目 × 演算子 × 値 を AND / OR で組み合わせ) ----------
  const toPairs = a => a.map(v => [v, v]);
  const FIELD_DEFS = {
    all:       { label: '全テキスト', type: 'text' },
    name:      { label: 'タスク名', type: 'text' },
    note:      { label: '備考', type: 'text' },
    link:      { label: 'リンク(別名・URL)', type: 'text' },
    status:    { label: 'ステータス', type: 'enum', options: toPairs(STATUSES) },
    priority:  { label: '優先度', type: 'enum', options: toPairs(PRIORITIES) },
    dueRel:    { label: '期日の状態', type: 'enum', options: DUE_RELS },
    due:       { label: '期日', type: 'date' },
    start:     { label: '着手日', type: 'date' },
    created:   { label: '起票日', type: 'date' },
    completed: { label: '完了日', type: 'date' },
    effort:    { label: '工数(h)', type: 'num' },
    remain:    { label: '残日数', type: 'num' },
  };
  const OPS = {
    text: [['has', 'を含む'], ['not', 'を含まない'], ['eq', 'と一致']],
    enum: [['is', 'である'], ['isnot', 'でない']],
    date: [['on', 'と同じ'], ['before', '以前'], ['after', '以降'], ['empty', 'が未設定'], ['set', 'が設定済み']],
    num:  [['gte', '以上'], ['lte', '以下'], ['eq', 'と等しい'], ['empty', 'が未設定']],
  };
  const textOf = (t, f) => {
    const links = (t.links || []).map(l => `${l.title} ${l.url}`).join(' ');
    return f === 'name' ? (t.name || '') : f === 'note' ? (t.note || '') : f === 'link' ? links : `${t.name || ''} ${t.note || ''} ${links}`;
  };
  const needsValue = c => c.op !== 'empty' && c.op !== 'set';
  const condReady = c => !!FIELD_DEFS[c.field] && (!needsValue(c) || String(c.value ?? '') !== '');
  function matchCond(t, c) {
    const d = FIELD_DEFS[c.field], v = c.value;
    if (d.type === 'text') {
      const hay = textOf(t, c.field).toLowerCase(), q = String(v).toLowerCase();
      return c.op === 'not' ? !hay.includes(q) : c.op === 'eq' ? hay === q : hay.includes(q);
    }
    if (d.type === 'enum') {
      const m = c.field === 'dueRel' ? matchDueRel(t, v) : t[c.field] === v;
      return c.op === 'isnot' ? !m : m;
    }
    if (d.type === 'date') {
      const x = t[c.field] || '';
      switch (c.op) {
        case 'empty': return !x;
        case 'set': return !!x;
        case 'on': return x === v;
        case 'before': return !!x && x <= v;
        case 'after': return !!x && x >= v;
      }
      return true;
    }
    const x = c.field === 'remain' ? (t.status === '完了' ? null : remainDays(t)) : (t.effort === '' || t.effort == null ? null : Number(t.effort));
    const n = Number(v);
    switch (c.op) {
      case 'empty': return x === null;
      case 'gte': return x !== null && x >= n;
      case 'lte': return x !== null && x <= n;
      case 'eq': return x !== null && x === n;
    }
    return true;
  }

  function visibleTasks() {
    const q = filters.text.trim().toLowerCase();
    const conds = filters.conds.filter(condReady);
    const advOk = t => !conds.length || (filters.mode === 'or' ? conds.some(c => matchCond(t, c)) : conds.every(c => matchCond(t, c)));
    let list = tasks.filter(t => {
      if (filters.status && t.status !== filters.status) return false;
      if (filters.priority && t.priority !== filters.priority) return false;
      if (filters.hideDone && t.status === '完了') return false;
      if (filters.dueRel && !matchDueRel(t, filters.dueRel)) return false;
      if (q && !textOf(t, filters.textField).toLowerCase().includes(q)) return false;
      if (!advOk(t)) return false;
      return true;
    });
    const val = t => {
      switch (sort.k) {
        case 'priority': return PRIO_ORDER[t.priority] ?? 9;
        case 'status': return STATUS_ORDER[t.status] ?? 9;
        case 'remain': return t.status === '完了' ? null : remainDays(t);
        case 'name': return t.name || '';
        default: return t[sort.k] || null;
      }
    };
    list.sort((a, b) => {
      const x = val(a), y = val(b);
      if (x === null && y === null) return 0;
      if (x === null) return 1;      // 空は常に末尾
      if (y === null) return -1;
      return (x < y ? -1 : x > y ? 1 : 0) * sort.dir;
    });
    return list;
  }

  // ---------- 描画 ----------
  const opts = (arr, sel) => arr.map(v => `<option${v === sel ? ' selected' : ''}>${v}</option>`).join('');

  function remainCell(t) {
    if (t.status === '完了') return '<td class="remain">—</td>';
    const r = remainDays(t);
    if (t.status === '保留') return `<td class="remain hold" title="${r === null ? '' : r < 0 ? -r + '日超過' : 'あと' + r + '日'}">保留中</td>`;
    if (r === null) return '<td class="remain">—</td>';
    if (r < 0) return `<td class="remain over">${-r}日超過</td>`;
    if (r === 0) return '<td class="remain soon">今日</td>';
    return `<td class="remain${r <= 3 ? ' soon' : ''}">あと${r}日</td>`;
  }

  function completedCell(t) {
    if (!t.completed) return '<td></td>';
    const s = parseDate(t.start);
    let extra = '';
    if (s) { const d = Math.round((parseDate(t.completed) - s) / 86400000); extra = `<div class="sub">${d <= 0 ? '当日完了' : '所要' + d + '日'}</div>`; }
    return `<td>${esc(t.completed)}${extra}</td>`;
  }

  function renderSummary() {
    const cnt = rel => tasks.filter(t => t.id !== newId && matchDueRel(t, rel)).length;
    const chips = [['overdue','over','超過'], ['today','today','今日'], ['d3','soon','明日〜3日後']]
      .map(([rel, cls, label]) => [rel, cls, label, cnt(rel)]).filter(c => c[3] > 0)
      .map(([rel, cls, label, n]) => `<button class="chip ${cls}${filters.dueRel === rel ? ' active' : ''}" data-due="${rel}">${label} <span>${n}件</span></button>`);
    const holds = tasks.filter(t => t.id !== newId && t.status === '保留').length;
    const holdChip = holds ? `<button class="chip hold${filters.status === '保留' ? ' active' : ''}" data-status="保留">保留中 <span>${holds}件</span></button>` : '';
    $('summary').innerHTML = (chips.length ? '期日アラート: ' + chips.join('') : '期限切れ・直近の期日のタスクはありません') + holdChip;
  }

  // ---------- 列定義 (並び順・幅はドラッグで変更でき、ブラウザに記憶) ----------
  const statusSel = t => `<select data-f="status">${opts(STATUSES, t.status)}</select>`;
  const noteCell = t => `<td><textarea data-f="note" rows="1">${esc(t.note)}</textarea></td>`;
  const isHttp = u => /^https?:\/\//i.test(u);
  const linkLabel = u => { try { const x = new URL(u); const s = x.hostname + (x.pathname === '/' ? '' : x.pathname) + x.search; return s.length > 48 ? s.slice(0, 47) + '…' : s; } catch { return u; } };
  // Teams のリンクは msteams: で直接アプリを開く (https のまま新しいタブで開くと、アプリ起動後に空のタブが残るため)
  const TEAMS_RE = /^https?:\/\/(?:[\w-]+\.)?(?:teams\.microsoft\.com|teams\.live\.com|teams\.cloud\.microsoft)\//i;
  const linkAttrs = url => TEAMS_RE.test(url)
    ? `href="${esc(url.replace(/^https?:/i, 'msteams:'))}" data-web="${esc(url)}"`
    : `href="${esc(url)}" target="_blank" rel="noopener noreferrer"`;
  const validLinks = t => (t.links || []).filter(l => isHttp(l.url));
  const linkTip = l => (l.title ? l.title + '\n' : '') + l.url;
  function linkCell(t) {
    const ls = validLinks(t);
    if (!ls.length) return '<td></td>';
    if (ls.length === 1) return `<td><a class="linkicon" ${linkAttrs(ls[0].url)} title="${esc(linkTip(ls[0]))}">🔗</a></td>`;
    return `<td><button class="linkbtn" data-a="links" title="${esc(ls.map(l => l.title || linkLabel(l.url)).join('\n'))}">🔗<span>${ls.length}</span></button></td>`;
  }
  // リンク編集: 「別名」「URL」を行ごとの入力欄で扱う
  const linkRow = (l = { title: '', url: '' }) =>
    `<div class="lrow"><input type="text" class="l-title" placeholder="別名(省略可)" value="${esc(l.title)}"><input type="url" class="l-url" placeholder="https://" value="${esc(l.url)}"><button type="button" class="lrm" data-a="lrm" title="この行を削除">×</button></div>`;
  const linkEdit = t => `<td><div class="linkedit">${((t.links || []).length ? t.links : [undefined]).map(linkRow).join('')}<button type="button" class="ladd" data-a="ladd">＋ リンク追加</button></div></td>`;
  const effortCell = t => `<td><input type="number" class="effort" data-f="effort" min="0" step="0.5" value="${esc(t.effort ?? '')}" placeholder="h"></td>`;
  const dateEdit = (id, v) => `<td><input type="date" id="${id}" value="${esc(v)}"></td>`;
  const COLS = {
    created:   { label: '起票日', sort: 'created', w: 130,
                 view: t => `<td>${esc(t.created)}</td>`, edit: t => dateEdit('e_created', t.created) },
    name:      { label: 'タスク名', sort: 'name', w: 200,
                 view: t => `<td class="name">${esc(t.name) || '<span style="color:var(--muted)">(無題)</span>'}</td>`,
                 edit: t => `<td class="name"><input type="text" id="e_name" value="${esc(t.name)}" placeholder="タスク名"></td>` },
    start:     { label: '着手日', sort: 'start', w: 130,
                 view: t => `<td>${t.start ? esc(t.start) : '<button data-a="start">着手開始</button>'}</td>`, edit: t => dateEdit('e_start', t.start) },
    due:       { label: '期日', sort: 'due', w: 130,
                 view: t => `<td>${esc(t.due)}</td>`, edit: t => dateEdit('e_due', t.due) },
    effort:    { label: '工数(h)', sort: 'effort', w: 90,
                 view: effortCell, edit: effortCell },
    priority:  { label: '優先度', sort: 'priority', w: 70,
                 view: t => `<td><span class="badge p-${esc(t.priority)}">${esc(t.priority)}</span></td>`,
                 edit: t => `<td><select id="e_priority">${opts(PRIORITIES, t.priority)}</select></td>` },
    status:    { label: 'ステータス', sort: 'status', w: 100,
                 view: t => `<td>${statusSel(t)}</td>`, edit: t => `<td>${statusSel(t)}</td>` },
    remain:    { label: '残日数', sort: 'remain', w: 90, view: remainCell, edit: remainCell },
    completed: { label: '完了日', sort: 'completed', w: 110, view: completedCell, edit: completedCell },
    link:      { label: 'リンク', w: 56, view: linkCell,
                 edit: linkEdit },
    note:      { label: '備考', w: 360, view: noteCell, edit: noteCell }, // 幅は画面の余りを吸収 (最低160px)
    act:       { label: '', w: 130, // 常に右端に固定
                 view: () => '<td class="act"><button data-a="edit">編集</button> <button class="danger" data-a="del">削除</button></td>',
                 edit: () => '<td class="act"><button class="primary" data-a="ok">保存</button> <button data-a="cancel">取消</button></td>' },
  };
  const DEFAULT_ORDER = Object.keys(COLS);
  const readJSON = key => { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } };
  let colOrder = (() => {
    const a = readJSON('taskColOrder2'); if (!Array.isArray(a)) return DEFAULT_ORDER.slice();
    const known = a.filter(k => k in COLS && k !== 'act');
    return [...known, ...DEFAULT_ORDER.filter(k => k !== 'act' && !known.includes(k)), 'act'];
  })();
  let colW = { ...Object.fromEntries(DEFAULT_ORDER.map(k => [k, COLS[k].w])), ...(readJSON('taskColW2') || {}) };
  const saveLayout = () => { try { localStorage.setItem('taskColOrder2', JSON.stringify(colOrder)); localStorage.setItem('taskColW2', JSON.stringify(colW)); } catch {} };

  function rowHtml(t) {
    if (t.id === editingId) return `<tr class="editing" data-id="${t.id}">${colOrder.map(k => COLS[k].edit(t)).join('')}</tr>`;
    const r = remainDays(t);
    const cls = t.status === '完了' ? 'done' : t.status === '保留' ? 'hold' : r === null ? '' : r < 0 ? 'overdue' : r === 0 ? 'today' : '';
    return `<tr class="${cls}" data-id="${t.id}">${colOrder.map(k => COLS[k].view(t)).join('')}</tr>`;
  }

  function renderHead() {
    $('thead').innerHTML = '<tr>' + colOrder.map(k => {
      const c = COLS[k];
      const arrow = c.sort && c.sort === sort.k ? (sort.dir > 0 ? '▲' : '▼') : '';
      return `<th data-key="${k}"${c.sort ? ` class="sortable" data-sort="${c.sort}"` : ''}${k !== 'act' ? ' draggable="true" title="ドラッグで列を移動"' : ''}>${c.label}${c.sort ? ` <span class="arrow">${arrow}</span>` : ''}<span class="rs"></span></th>`;
    }).join('') + '</tr>';
  }

  function applyWidths() {
    // 編集中はリンク入力欄のために一時的に幅を確保
    // 画面幅に収まる範囲で広げる (備考の最低幅160pxは確保し、横スクロールを出さない)
    const avail = $('tbl').parentNode.clientWidth;
    const others = colOrder.reduce((a, k) => a + (k === 'link' || k === 'note' ? 0 : colW[k]), 0);
    const editLinkW = Math.max(colW.link, Math.min(300, avail - others - 160));
    const ws = colOrder.map(k => k === 'link' && editingId ? editLinkW : colW[k]);
    // 備考列だけ幅指定なし: 画面幅いっぱいに広げ、余った幅を備考が吸収する (他の列の合計+備考の最小幅を下回ったら横スクロール)
    $('cols').innerHTML = colOrder.map((k, i) => k === 'note' ? '<col>' : `<col style="width:${ws[i]}px">`).join('');
    $('tbl').style.width = '100%';
    $('tbl').style.minWidth = colOrder.reduce((a, k, i) => a + (k === 'note' ? 160 : ws[i]), 0) + 'px';
  }

  function bindHead() {
    const head = $('thead');
    // 並び替え
    head.addEventListener('click', e => {
      if (e.target.closest('.rs')) return;
      const th = e.target.closest('th[data-sort]'); if (!th) return;
      sort = { k: th.dataset.sort, dir: sort.k === th.dataset.sort ? -sort.dir : 1 };
      render();
    });
    // 列幅 (境界をドラッグ / ダブルクリックで初期幅)
    head.addEventListener('dblclick', e => {
      const h = e.target.closest('.rs'); if (!h) return;
      const k = h.parentNode.dataset.key; colW[k] = COLS[k].w; saveLayout(); applyWidths();
    });
    head.addEventListener('pointerdown', e => {
      const h = e.target.closest('.rs'); if (!h) return;
      const th = h.parentNode, k = th.dataset.key;
      e.preventDefault(); th.draggable = false; h.setPointerCapture(e.pointerId); h.classList.add('drag');
      const x0 = e.clientX, w0 = th.offsetWidth;
      const move = ev => { colW[k] = Math.max(40, w0 + ev.clientX - x0); applyWidths(); };
      const up = () => {
        h.classList.remove('drag'); th.draggable = k !== 'act';
        h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
        saveLayout();
      };
      h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
    });
    // 列の移動 (見出しをドラッグ&ドロップ。操作列は右端固定)
    let dragKey = null;
    const marks = () => head.querySelectorAll('th').forEach(t => t.classList.remove('drop-l', 'drop-r', 'dragging'));
    const isLeft = (e, th) => th.dataset.key === 'act' || e.clientX < th.getBoundingClientRect().left + th.offsetWidth / 2;
    head.addEventListener('dragstart', e => {
      const th = e.target.closest('th'); if (!th) return;
      dragKey = th.dataset.key; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragKey);
      th.classList.add('dragging');
    });
    head.addEventListener('dragover', e => {
      const th = e.target.closest('th'); if (!dragKey || !th) return;
      e.preventDefault();
      head.querySelectorAll('th').forEach(t => t.classList.remove('drop-l', 'drop-r'));
      th.classList.add(isLeft(e, th) ? 'drop-l' : 'drop-r');
    });
    head.addEventListener('drop', e => {
      const th = e.target.closest('th'); if (!dragKey || !th) return;
      e.preventDefault();
      if (th.dataset.key !== dragKey) {
        const o = colOrder.filter(k => k !== dragKey);
        let i = o.indexOf(th.dataset.key); if (!isLeft(e, th)) i++;
        o.splice(i, 0, dragKey);
        colOrder = [...o.filter(k => k !== 'act'), 'act'];
        saveLayout();
      }
      dragKey = null; render();
    });
    head.addEventListener('dragend', () => { dragKey = null; marks(); });

    $('btnColReset').onclick = () => {
      colOrder = DEFAULT_ORDER.slice(); colW = Object.fromEntries(DEFAULT_ORDER.map(k => [k, COLS[k].w]));
      saveLayout(); render();
    };
  }

  // 件数・工数合計 (工数は入力中の値もリアルタイムに反映)
  let shown = [];
  const liveEffort = new Map(); // 入力中でまだ確定していない工数 (id → 値)
  function updateCount() {
    const hours = shown.reduce((a, t) => a + (Number(liveEffort.has(t.id) ? liveEffort.get(t.id) : t.effort) || 0), 0);
    $('count').textContent = `${shown.length} / ${tasks.length - (newId ? 1 : 0)} 件 ・ 工数計 ${Math.round(hours * 100) / 100}h`;
  }

  const PAGE_SIZE = 200;
  let limit = PAGE_SIZE, lastSig = '';
  function render() {
    closeLinkMenu();
    renderHead();
    applyWidths();
    const list = visibleTasks();
    const fresh = newId && tasks.find(x => x.id === newId);
    if (fresh) { const i = list.indexOf(fresh); if (i >= 0) list.splice(i, 1); list.unshift(fresh); } // 追加直後の行は常に先頭で入力
    // 件数が多いときは先頭から段階的に表示 (条件・並び順を変えると先頭に戻る)
    const sig = JSON.stringify([filters, sort]);
    if (sig !== lastSig) { limit = PAGE_SIZE; lastSig = sig; }
    const view = list.slice(0, limit);
    $('rows').innerHTML = view.map(rowHtml).join('');
    $('empty').hidden = list.length > 0;
    const rest = list.length - view.length;
    $('moreRows').hidden = rest <= 0;
    if (rest > 0) $('moreRows').innerHTML = `${view.length} / ${list.length} 件を表示中　<button data-more="${PAGE_SIZE * 2}">さらに${Math.min(PAGE_SIZE * 2, rest)}件表示</button> <button data-more="all">すべて表示 (${list.length}件)</button>`;
    shown = list; liveEffort.clear(); updateCount();
    renderSummary();
    autoGrow();
    const nm = $('e_name'); if (nm && !nm.dataset.focused) { nm.dataset.focused = 1; nm.focus(); }
  }

  // ---------- リンク一覧ポップアップ ----------
  let linkMenu = null;
  function closeLinkMenu() { if (linkMenu) { linkMenu.remove(); linkMenu = null; } }
  function showLinkMenu(btn, t) {
    const reopen = linkMenu && linkMenu.dataset.id === t.id;
    closeLinkMenu(); if (reopen) return; // 同じボタンをもう一度押したら閉じる
    const m = document.createElement('div');
    m.className = 'linkmenu'; m.dataset.id = t.id;
    m.innerHTML = validLinks(t).map(l =>
      `<a ${linkAttrs(l.url)} title="${esc(l.url)}">🔗 ${l.title ? `<b>${esc(l.title)}</b><small>${esc(linkLabel(l.url))}</small>` : esc(linkLabel(l.url))}</a>`).join('');
    document.body.appendChild(m);
    const r = btn.getBoundingClientRect();
    m.style.left = Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8)) + 'px';
    m.style.top = (r.bottom + m.offsetHeight + 12 > innerHeight ? Math.max(8, r.top - m.offsetHeight - 4) : r.bottom + 4) + 'px';
    linkMenu = m;
    m.addEventListener('click', e => { if (e.target.closest('a')) closeLinkMenu(); });
  }
  document.addEventListener('click', e => {
    const a = e.target.closest('a[data-web]');
    if (a && (e.shiftKey || e.ctrlKey || e.metaKey)) { e.preventDefault(); window.open(a.dataset.web, '_blank', 'noopener'); }
  });
  document.addEventListener('mousedown', e => { if (linkMenu && !e.target.closest('.linkmenu, .linkbtn')) closeLinkMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLinkMenu(); });
  window.addEventListener('scroll', closeLinkMenu, true);
  window.addEventListener('resize', closeLinkMenu);

  function autoGrow(root = document) {
    // 読み取りと書き込みをまとめて行う (行ごとに交互にすると、強制レイアウトが行数分発生して極端に遅くなる)
    const tas = [...root.querySelectorAll('td textarea')];
    tas.forEach(a => { a.style.height = 'auto'; });
    const hs = tas.map(a => a.scrollHeight);
    tas.forEach((a, i) => { a.style.height = Math.max(30, hs[i] + 2) + 'px'; });
  }

  // ---------- イベント ----------
  function bindFilters() {
    $('fStatus').innerHTML = '<option value="">ステータス: すべて</option>' + opts(STATUSES);
    $('fPriority').innerHTML = '<option value="">優先度: すべて</option>' + opts(PRIORITIES);
    $('fDueRel').innerHTML = '<option value="">期日: 指定なし</option>' + DUE_RELS.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
    const on = (id, key, ev = 'input', get = e => e.target.value) =>
      $(id).addEventListener(ev, e => { filters[key] = get(e); $('fPreset').value = ''; render(); });
    $('fTextField').innerHTML = Object.entries(FIELD_DEFS).filter(([, f]) => f.type === 'text').map(([k, f]) => `<option value="${k}">${f.label}</option>`).join('');
    on('fText', 'text'); on('fTextField', 'textField', 'change');
    on('fStatus', 'status', 'change'); on('fPriority', 'priority', 'change');
    on('fHideDone', 'hideDone', 'change', e => e.target.checked);
    on('fDueRel', 'dueRel', 'change');
    $('btnClear').onclick = () => {
      Object.assign(filters, defaultFilters());
      $('fPreset').value = '';
      syncFilterInputs(); render();
    };

    // サマリーのチップで期日・保留のフィルタを切替
    $('summary').addEventListener('click', e => {
      const c = e.target.closest('[data-due], [data-status]'); if (!c) return;
      if (c.dataset.due) filters.dueRel = filters.dueRel === c.dataset.due ? '' : c.dataset.due;
      else filters.status = filters.status === c.dataset.status ? '' : c.dataset.status;
      $('fPreset').value = ''; syncFilterInputs(); render();
    });

    const more = $('more');
    more.addEventListener('click', e => { if (e.target.closest('.menu button')) more.open = false; });
    document.addEventListener('mousedown', e => { if (more.open && !more.contains(e.target)) more.open = false; });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') more.open = false; });

    // 詳細条件 (AND / OR)
    $('btnAdv').onclick = () => { advOpen = !advOpen; renderConds(); };
    $('advMode').addEventListener('change', e => { filters.mode = e.target.value; condsChanged(false); });
    $('btnAddCond').onclick = () => {
      filters.conds.push({ field: 'all', op: 'has', value: '' });
      advOpen = true; renderConds();
      const last = $('conds').querySelector('.crow:last-child [data-p="value"]'); if (last) last.focus();
    };
    $('conds').addEventListener('input', e => {
      const el = e.target; if (el.tagName !== 'INPUT' || el.dataset.p !== 'value') return;
      filters.conds[+el.dataset.i].value = el.value; condsChanged(false);   // 入力中もリアルタイムに絞り込み
    });
    $('conds').addEventListener('change', e => {
      const el = e.target, p = el.dataset.p; if (!p) return;
      const c = filters.conds[+el.dataset.i];
      if (el.tagName === 'INPUT') { c.value = el.value; return condsChanged(false); }
      if (p === 'field') { const d = FIELD_DEFS[el.value]; c.field = el.value; c.op = OPS[d.type][0][0]; c.value = d.type === 'enum' ? d.options[0][0] : ''; }
      else c[p] = el.value;
      condsChanged(true);
    });
    $('conds').addEventListener('click', e => {
      const x = e.target.closest('[data-x]'); if (!x) return;
      filters.conds.splice(+x.dataset.x, 1); condsChanged(true);
    });

    // 保存した条件
    $('fPreset').addEventListener('change', e => {
      const p = presets.find(x => x.name === e.target.value); if (!p) return;
      Object.assign(filters, defaultFilters(), { hideDone: false }, JSON.parse(JSON.stringify(p.filters)));
      if (filters.from) filters.conds.push({ field: 'due', op: 'after', value: filters.from });
      if (filters.to) filters.conds.push({ field: 'due', op: 'before', value: filters.to });
      delete filters.from; delete filters.to;
      if (p.sort) sort = { ...p.sort };
      syncFilterInputs(); render();
    });
    $('btnPresetSave').onclick = () => {
      const name = (prompt('この絞り込み条件の名前を入力してください', $('fPreset').value) || '').trim();
      if (!name) return;
      const entry = { name, filters: JSON.parse(JSON.stringify(filters)), sort: { ...sort } };
      const i = presets.findIndex(p => p.name === name);
      if (i >= 0) { if (!confirm(`「${name}」は既にあります。上書きしますか？`)) return; presets[i] = entry; }
      else presets.push(entry);
      save(); renderPresets(name);
    };
    $('btnPresetDel').onclick = () => {
      const name = $('fPreset').value;
      if (!name) return alert('削除する条件を「保存した条件」から選んでください');
      if (!confirm(`条件「${name}」を削除しますか？`)) return;
      presets = presets.filter(p => p.name !== name);
      save(); renderPresets();
    };
  }

  function condRowHtml(c, i) {
    const d = FIELD_DEFS[c.field];
    const fsel = `<select data-i="${i}" data-p="field">${Object.entries(FIELD_DEFS).map(([k, f]) => `<option value="${k}"${k === c.field ? ' selected' : ''}>${f.label}</option>`).join('')}</select>`;
    const osel = `<select data-i="${i}" data-p="op">${OPS[d.type].map(([k, l]) => `<option value="${k}"${k === c.op ? ' selected' : ''}>${l}</option>`).join('')}</select>`;
    let val = '';
    if (needsValue(c)) {
      val = d.type === 'enum'
        ? `<select data-i="${i}" data-p="value">${d.options.map(([k, l]) => `<option value="${esc(k)}"${k === c.value ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`
        : `<input data-i="${i}" data-p="value" type="${d.type === 'date' ? 'date' : d.type === 'num' ? 'number' : 'text'}"${d.type === 'num' ? ' step="0.5"' : ''} value="${esc(c.value)}" placeholder="${d.type === 'text' ? '検索する文字' : ''}">`;
    }
    return `<div class="crow">${fsel}${osel}${val}<button type="button" class="lrm" data-x="${i}" title="この条件を削除">×</button></div>`;
  }
  function updateAdvButton() {
    const n = filters.conds.filter(condReady).length;
    $('btnAdv').textContent = '詳細条件' + (n ? ` (${n})` : '') + (advOpen ? ' ▴' : ' ▾');
  }
  function renderConds() {
    $('conds').innerHTML = filters.conds.map(condRowHtml).join('') || '<div class="hint">条件がありません。「＋ 条件を追加」で追加できます。</div>';
    $('advMode').value = filters.mode;
    $('adv').hidden = !advOpen;
    updateAdvButton();
  }
  function condsChanged(rebuild) {
    $('fPreset').value = '';
    if (rebuild) renderConds(); else updateAdvButton();
    render();
  }

  function syncFilterInputs() {
    if (filters.conds.length) advOpen = true;
    renderConds();
    $('fTextField').value = filters.textField;
    $('fText').value = filters.text; $('fStatus').value = filters.status; $('fPriority').value = filters.priority;
    $('fHideDone').checked = filters.hideDone; $('fDueRel').value = filters.dueRel;
  }

  function renderPresets(selected = '') {
    $('fPreset').innerHTML = '<option value="">保存した条件…</option>' + presets.map(p => `<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('');
    $('fPreset').value = selected;
    $('btnPresetDel').disabled = !presets.length;
  }

  function bindTable() {
    $('moreRows').addEventListener('click', e => {
      const b = e.target.closest('[data-more]'); if (!b) return;
      limit = b.dataset.more === 'all' ? Infinity : limit + Number(b.dataset.more);
      render();
    });

    $('rows').addEventListener('click', e => {
      const btn = e.target.closest('button[data-a]'); if (!btn) return;
      const tr = btn.closest('tr'); const t = tasks.find(x => x.id === tr.dataset.id); if (!t) return;
      switch (btn.dataset.a) {
        case 'edit': editingId = t.id; render(); break;
        case 'links': showLinkMenu(btn, t); break;
        case 'ladd': {
          btn.insertAdjacentHTML('beforebegin', linkRow());
          btn.previousElementSibling.querySelector('.l-title').focus(); break;
        }
        case 'lrm': {
          const row = btn.closest('.lrow'), box = row.parentNode;
          if (box.querySelectorAll('.lrow').length > 1) row.remove();
          else row.querySelectorAll('input').forEach(i => i.value = ''); // 最後の1行は空にする
          break;
        }
        case 'cancel':
          if (t.id === newId) tasks = tasks.filter(x => x !== t); // 追加直後の未確定レコードは破棄
          editingId = null; newId = null; render(); break;
        case 'start':
          if (confirm(`「${t.name || '(無題)'}」に着手しますか？\n着手日を本日にし、ステータスを「進行中」にします。`)) {
            pushUndo('着手開始');
            t.start = localISO(today());
            setStatus(t, '進行中');
            save(); render();
          }
          break;
        case 'ok': {
          const name = $('e_name').value.trim();
          const start = $('e_start').value, due = $('e_due').value;
          if (!name) { alert('タスク名を入力してください'); $('e_name').focus(); return; }
          if (start && due && start > due) { alert('着手日が期日より後になっています'); return; }
          const seen = new Set(); const links = [];
          for (const row of tr.querySelectorAll('.lrow')) {
            const title = row.querySelector('.l-title').value.trim();
            let url = row.querySelector('.l-url').value.trim();
            if (!url) { if (title) { alert(`別名「${title}」に対応するURLが入力されていません`); row.querySelector('.l-url').focus(); return; } continue; }
            if (!/^[a-z][a-z0-9+.-]*:/i.test(url)) url = 'https://' + url;
            if (!isHttp(url)) { alert('リンクは http:// か https:// で始まるURLのみ登録できます: ' + url); row.querySelector('.l-url').focus(); return; }
            if (!seen.has(url)) { seen.add(url); links.push({ title, url }); }
          }
          pushUndo(t.id === newId ? '追加' : '編集');
          Object.assign(t, { name, created: $('e_created').value, start, due, priority: $('e_priority').value, links });
          delete t.link;
          editingId = null; newId = null; save(); render(); break;
        }
        case 'del':
          if (confirm(`「${t.name || '(無題)'}」を削除しますか？\n(「元に戻す」で復元できます)`)) { pushUndo('削除'); tasks = tasks.filter(x => x !== t); save(); render(); }
          break;
      }
    });

    // 編集中の行で Enter → 保存 (日本語入力の変換確定中は除く / 備考の改行は Shift+Enter ではなく通常のまま)
    $('rows').addEventListener('keydown', e => {
      if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
      if (!e.target.matches('tr.editing input')) return;
      e.preventDefault();
      e.target.closest('tr').querySelector('button[data-a="ok"]').click();
    });

    // 備考・ステータスは常時編集 (編集中でもその場で反映)
    $('rows').addEventListener('change', e => {
      const f = e.target.dataset.f; if (!f) return;
      const t = tasks.find(x => x.id === e.target.closest('tr').dataset.id); if (!t) return;
      pushUndo({ status: 'ステータス変更', effort: '工数の変更' }[f] || '備考の変更');
      if (f === 'status') setStatus(t, e.target.value);
      else if (f === 'effort') { t.effort = e.target.value === '' ? '' : Math.max(0, Number(e.target.value)); liveEffort.delete(t.id); updateCount(); }
      else t[f] = e.target.value;
      save();
      if (f === 'status' && editingId !== t.id) render(); // フィルタ・残日数・完了表示に反映
    });
    $('rows').addEventListener('input', e => {
      if (e.target.tagName === 'TEXTAREA') autoGrow(e.target.closest('td'));
      if (e.target.dataset.f === 'effort') { liveEffort.set(e.target.closest('tr').dataset.id, e.target.value); updateCount(); }
    });

    $('btnAdd').onclick = () => {
      if (newId) tasks = tasks.filter(x => x.id !== newId); // 未確定の前回分は破棄
      const t = { id: uid(), name: '', created: localISO(today()), start: '', due: '', priority: '中', status: '未着手', links: [], note: '' };
      // 新規行が絞り込みで消えないよう、フィルタを解除
      $('btnClear').click();
      tasks.push(t); editingId = newId = t.id; render();
      document.querySelector('.tablewrap').scrollTop = 0;
    };
  }

  // ---------- 外部更新 (OneDrive 同期) の検知 ----------
  async function checkExternalChange() {
    if (!handle || $('app').hidden || editingId) return;
    try {
      if (await handle.queryPermission({ mode: 'readwrite' }) !== 'granted') return;
      const f = await handle.getFile();
      if (f.lastModified > lastModified) { await saving; await loadFile(); resetHistory(); renderPresets($('fPreset').value); render(); setState('外部の更新を読み込みました', 'ok'); }
    } catch (e) { console.warn(e); }
  }

  // ---------- 起動 ----------
  async function init() {
    bindFilters(); bindTable(); bindHead();
    $('btnNew').onclick = createFile;
    $('btnOpen').onclick = openFile;
    $('btnUndo').onclick = undo;
    $('btnRedo').onclick = redo;
    document.addEventListener('keydown', e => {
      if (!(e.ctrlKey || e.metaKey) || $('app').hidden) return;
      if (e.target.closest('input:not([type=checkbox]), textarea, select')) return; // 入力中はブラウザ標準の取消
      const k = e.key.toLowerCase();
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
      else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
    });
    $('btnOther').onclick = () => { $('reconnect').hidden = true; showWelcome(); };
    $('btnChange').onclick = () => { editingId = null; showWelcome(); };
    $('btnReconnect').onclick = async () => {
      try {
        // ユーザー操作の直後に呼ぶ必要があるため、事前の await を挟まず直接 requestPermission する
        $('reconnectMsg').textContent = '許可を確認しています… ブラウザの上部/アドレスバー付近に出るダイアログで「許可」を選んでください。';
        const hint = setTimeout(() => { $('reconnectMsg').textContent = '許可ダイアログが出ない場合、このブラウザ/開き方では許可を取れません。「同じファイルを選び直す」を押してください。'; }, 4000);
        let st;
        try { st = await handle.requestPermission({ mode: 'readwrite' }); } finally { clearTimeout(hint); }
        if (st !== 'granted') return showReconnect(`許可が得られませんでした(状態: ${st})。「同じファイルを選び直す」を試してください。`);
        await loadFile(); showApp();
      } catch (e) { showReconnect(`再接続に失敗しました: ${e.name}: ${e.message}。「同じファイルを選び直す」を試してください。`); }
    };
    $('btnRepick').onclick = async () => {
      try {
        const [h] = await showOpenFilePicker({ types: pickerTypes, startIn: handle || undefined });
        await useHandle(h, false);
      } catch (e) { if (e.name !== 'AbortError') showReconnect(`読み込みに失敗しました: ${e.name}: ${e.message}`); }
    };
    window.addEventListener('resize', () => { if (!$('app').hidden) applyWidths(); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) checkExternalChange(); });
    window.addEventListener('focus', checkExternalChange);
    setInterval(checkExternalChange, 30000);

    if (!window.showOpenFilePicker) {
      showWelcome(); $('unsupported').hidden = false; $('btnNew').disabled = $('btnOpen').disabled = true; return;
    }
    try {
      handle = await idb.get('handle');
    } catch (e) { console.warn(e); }
    if (!handle) return showWelcome();
    try {
      if (await ensurePermission(false)) { await loadFile(); showApp(); }
      else showReconnect();
    } catch (e) {
      showReconnect('「' + handle.name + '」を読み込めません: ' + e.message);
    }
  }
  init();
})();
</script>
</body>
</html>
